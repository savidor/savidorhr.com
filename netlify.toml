# SavidorHR marketing site — Netlify configuration.
# The repo root is the marketing site itself, so no base directory is needed.

[build]
  command   = "python3 build.py"
  publish   = "site"
  functions = "netlify/functions"

# Pricing was removed deliberately. Anyone arriving on an old link lands on the
# contact page, which is where the answer now is.
[[redirects]]
  from   = "/pricing"
  to     = "/contact.html"
  status = 301

[[redirects]]
  from   = "/pricing.html"
  to     = "/contact.html"
  status = 301

# Netlify already serves /crm for crm.html, so clean URLs need no rules.
# Anything genuinely missing gets the home page rather than a bare 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"
