# SavidorHR marketing site — Netlify configuration.
# The repo root is the marketing site itself, so no base directory is needed.

[build]
  command   = "python3 build.py"
  publish   = "site"
  functions = "netlify/functions"

# Netlify already serves /crm for crm.html, so clean URLs need no rules.
# Anything genuinely missing gets the home page rather than a bare 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Safe to cache hard ONLY because the filename carries a content hash, so the
# URL changes whenever the bytes do. Caching an unversioned /site.css this way
# served week-old CSS against fresh HTML and rendered the site unstyled.
[[headers]]
  for = "/site.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Belt and braces: never let the old unversioned path be cached again.
[[headers]]
  for = "/site.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The fonts are content hashed by build.py for the same reason the stylesheet
# is, so the same long cache is safe on them. They are also the largest thing
# the site downloads, which makes a repeat visit almost free.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always be revalidated, or a cached page keeps pointing at a
# stylesheet that has since been replaced. This is the pairing that makes
# immutable caching of the hashed assets above safe.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
