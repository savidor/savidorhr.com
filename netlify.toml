# SavidorHR marketing site — Netlify configuration.
# The repo root is the marketing site itself, so no base directory is needed.

[build]
  command   = "python3 build.py"
  publish   = "site"
  functions = "netlify/functions"

# Netlify already serves /crm for crm.html, so clean URLs need no rules.
# Anything genuinely missing gets the home page rather than a bare 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"
